name: CrimeStats Scraper

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}   # lubab ka käsitsi "Run workflow" nupust käivitada

jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job: [red, blue, white, white2, w2, green]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, dom, mbstring

      - name: Install Node deps (Playwright)
        run: npm install

      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium

      # 1. Küsi crimestatistics.eu-lt kasutajate nimekiri läbi päris
      #    headless brauseri, et robotitõrje JS-väljakutse läbida.
      - name: Get users list (${{ matrix.job }})
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          SCRAPE_SECRET: ${{ secrets.SCRAPE_SECRET }}
        run: node browser_bridge.mjs get-users "$SITE_URL" "$SCRAPE_SECRET" "${{ matrix.job }}" > users.json

      # 2. Skreipi crime.ee-lt (tavaline cURL, pole blokeeritud)
      - name: Scrape crime.ee (${{ matrix.job }})
        run: php scraper.php "${{ matrix.job }}" users.json records.json

      # 3. Saada tulemused tagasi crimestatistics.eu-le, jälle läbi
      #    päris brauseri, sama robotitõrje tõttu.
      - name: Submit results (${{ matrix.job }})
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          SCRAPE_SECRET: ${{ secrets.SCRAPE_SECRET }}
        run: node browser_bridge.mjs submit "$SITE_URL" "$SCRAPE_SECRET" "${{ matrix.job }}" records.json
