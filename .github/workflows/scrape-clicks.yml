name: CrimeStats Klikkide skreipimine

on:
  schedule:
    # Tavaline: iga tund 17. minutil
    - cron: '17 * * * *'
    # Päeva lõpu tihe kogumine: crime.ee klikkide tabel nullub Eesti aja järgi 00:05,
    # seega tahame viimase lugemise 23:35–00:04 vahel (GitHubi ajastus hilineb sageli
    # 5–15 min, siis on mitu katset). Kaetud on nii suveaeg (UTC+3) kui talveaeg (UTC+2)
    # — lisaskreipid on kahjutud, sest salvestatakse alati päeva SUURIM väärtus.
    - cron: '35,40,45,50,55 20 * * *'
    - cron: '0,2,4,35,40,45,50,55 21 * * *'
    - cron: '0,2,4 22 * * *'
  workflow_dispatch: {}    # käsitsi käivitamiseks ("Run workflow" nupp)

jobs:
  scrape-clicks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job: [red, blue, white, white2, w2, green]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, dom, mbstring

      - name: Install Node deps (Playwright)
        run: npm install

      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium

      # 1. Küsi crimestatistics.eu-lt sama töö url_m väärtus (taaskasutame
      #    olemasolevat scrape_get_users.php endpointi — kasutajate
      #    nimekirja ennast siin ei vajata, ainult url_m).
      - name: Get job info (${{ matrix.job }})
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          SCRAPE_SECRET: ${{ secrets.SCRAPE_SECRET }}
        run: node browser_bridge.mjs get-users "$SITE_URL" "$SCRAPE_SECRET" "${{ matrix.job }}" > users.json

      # 2. Loe crime.ee klikkide edetabelit (a=8&top=98) — tavaline cURL,
      #    seda lehte ei blokeerita.
      - name: Scrape clicks leaderboard (${{ matrix.job }})
        run: php clicks_scraper.php "${{ matrix.job }}" users.json clicks.json

      - name: Upload debug HTML (kui tekkis)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-clicks-${{ matrix.job }}
          path: debug_clicks_*.html
          if-no-files-found: ignore
          retention-days: 3

      # 3. Saada klikid crimestatistics.eu-le; seal hoitakse iga
      #    kasutaja+kalendripäeva kohta suurimat nähtud väärtust.
      - name: Submit clicks (${{ matrix.job }})
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          SCRAPE_SECRET: ${{ secrets.SCRAPE_SECRET }}
        run: node browser_bridge.mjs submit-clicks "$SITE_URL" "$SCRAPE_SECRET" "${{ matrix.job }}" clicks.json
